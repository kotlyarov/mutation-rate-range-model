[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mutation-rate-range-model"
version = "0.1.0"
description = "Exploratory lineage model for mutation-rate trade-offs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "plotly>=5.18",
]

[project.optional-dependencies]
app = ["streamlit>=1.31"]
test = ["pytest>=7.4"]
dev = [
  "pytest>=7.4",
  "streamlit>=1.31",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
